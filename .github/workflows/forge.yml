name: Deploy to EC2 Server of atlasliving (ATLAS FORGE)

on:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  # ---------------------------------------------------------------------------
  # 1) Validate on the GitHub runner so a broken build never reaches EC2.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true # report issues without blocking the deploy

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2) Deploy over SSH to the EC2 server (only if the build job passed).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/atlas-forge
            git fetch origin main
            git reset --hard origin/main
            # Full install: devDependencies (Tailwind, eslint-config-next) are
            # required to produce the production build.
            npm ci
            # Next.js needs a production build before `next start` will run.
            npm run build
            # This is a Next.js app (started via `next start`, i.e. `npm start`),
            # not a bare Node server — there is no server.js to launch.
            pm2 restart atlas-forge || pm2 start npm --name atlas-forge -- start
            pm2 save
