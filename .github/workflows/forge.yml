name: Deploy to EC2 Server of atlasliving (ATLAS FORGE)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}      # EC2 Public IP
          EC2_USER: ${{ secrets.EC2_USER }}      # ubuntu
          EC2_KEY:  ${{ secrets.EC2_SSH_KEY }}   # SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem

          ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            set -e

            cd /home/ubuntu/atlas-forge

            git pull origin main

            # Preflights .env, builds, re-creates the PM2 process from
            # ecosystem.config.cjs (node --env-file=.env), then runs the
            # read-only `npm run db:check`. Never touches the database schema
            # or data, and never edits .env. See scripts/deploy.sh.
            bash scripts/deploy.sh
          EOF

          rm -f ~/.ssh/key.pem
