name: Deploy to EC2 Server of atlasliving (ATLAS FORGE)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}      # EC2 Public IP
          EC2_USER: ${{ secrets.EC2_USER }}      # ubuntu
          EC2_KEY:  ${{ secrets.EC2_SSH_KEY }}   # SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem

          ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            set -e

            cd /home/ubuntu/atlas-forge

            # The release that is running now: the automatic rollback target.
            PREV_SHA=$(git rev-parse HEAD)
            git pull origin main

            # Preflight, build while the old release serves, short Forge-only
            # maintenance window (one-time forge_ table-prefix migration with a
            # verified backup), start, smoke checks; any failure restores
            # PREV_SHA automatically. Never seeds/resets, drops, truncates or
            # edits .env. See scripts/deploy.sh.
            PREV_SHA="$PREV_SHA" bash scripts/deploy.sh
          EOF

          rm -f ~/.ssh/key.pem
