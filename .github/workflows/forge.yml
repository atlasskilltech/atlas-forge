name: Deploy to EC2 Server of atlasliving (ATLAS FORGE)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/atlas-forge
            git fetch origin main
            git reset --hard origin/main
            # Full install: devDependencies (Tailwind, eslint-config-next) are
            # required to produce the production build.
            npm ci
            # Next.js needs a production build before `next start` will run.
            npm run build
            # Start (or reload, if already running) under pm2 using the
            # committed ecosystem file. startOrReload is idempotent: it starts
            # the app on first deploy and reloads it on subsequent deploys.
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
